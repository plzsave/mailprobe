[project]
name = "mailprobe"
version = "0.1.0"
description = "MTA別メール配信結果を多角的に検証するツール (Gmail / Outlook / iCloud 対応)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.127.0",
    "charset-normalizer>=3.3.0",
    "msal>=1.28.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
mailprobe = "mailprobe.__main__:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailprobe"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.15.7",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter が担当)
    "RUF001", # 文字列中の全角文字 (日本語プロジェクトで意図的)
    "RUF002", # docstring 中の全角文字 (同上)
    "RUF003", # コメント中の全角文字 (同上)
]

[tool.ruff.lint.isort]
known-first-party = ["mailprobe"]

# ---------------------------------------------------------------------------
# pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src"]
exclude = ["**/node_modules", "**/.*", ".venv", "**/__pycache__"]
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
